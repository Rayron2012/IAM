# Fonte da barra de progresso publicada no README.
#
# A barra júnior conta só os itens obrigatórios das fases f1 a f5.
# Fases f6 a f10 são diferenciais e não entram nessa porcentagem.
# Itens opcionais têm peso 0.
#
# Para concluir um item:
#   1. Troque done para true neste arquivo (não altere id, titulo, peso nem a ordem).
#   2. Rode: python3 scripts/atualizar-progresso.py
# O script atualiza a barra do README, os selos em docs/ e a caixa no README da fase.
# A trilha interativa guarda outro progresso, só no navegador. Marque o mesmo id lá se quiser.
#
# Ids e títulos têm de continuar iguais aos de docs/trilha-iam.html.
# Peso padrão do obrigatório: 1. Só aumente o peso se aquele item passar a valer mais
# na meta júnior de propósito. Opcional permanece com peso 0.
# Evidência de lab real (tenant, UPN, OID, segredo, log) não entra neste arquivo.

